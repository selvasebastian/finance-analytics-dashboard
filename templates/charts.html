<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charts</title>

    <!--Bootstrap for layout-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>    

<nav class="navbar navbar-expand navbar-light bg-light">
    <div class="container">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/transactions">Transactions</a>
        <a class="nav-link" href="/charts">Charts</a>
    </div>
</nav>

<div class="container mt-4">
    <h1>Charts</h1>

    <h2>Set Budget</h2>
    <form id="set-budget-form" class="row g-2 mb-4">
        <div class="col-auto">
            <select id="budget-category" class="form-select">
                <option value="">Overall</option>
            </select>
        </div>
        <div class="col-auto">
            <input type="number" step="0.01" id="budget-limit" class="form-control" placeholder="Limit in EUR" required>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Save Budget</button>
        </div>
    </form>

    <h2>Spending by category</h2>
    <canvas id="category-chart"></canvas>

    <h2 class="mt-4">Income by Category</h2>
    <canvas id="income-chart"></canvas>

    <h2 class="mt-4">Overall Budget</h2>
    <canvas id="overall-budget-chart"></canvas>

    <h2 class="mt-4">Budget per Category</h2>
    <canvas id="category-budget-chart"></canvas>

    <h2 class="mt-4">Income vs. Expenses</h2>
    <canvas id="monthly-chart"></canvas>

    <h2 class="mt-4">Spending Trends</h2>
    <canvas id="trends-chart"></canvas>

    <h2 class="mt-4">Net Worth</h2>
    <canvas id="networth-chart"></canvas>

</div>

<!--Chart.js for the graphs-->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!--JavaScripts that loads and draws the charts-->
<script src="{{ url_for('static', filename='charts.js')}}"></script>

</body>
</html>
