<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charts</title>

    <!--Bootstrap for layout-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!--"Custom" CSS so the charts don't get so big-->
<style>
    .chart-box {
        max-width: 450px;
        margin: 0 auto;
    }
</style>
</head>
<body>    

<nav class="navbar navbar-expand navbar-light bg-light">
    <div class="container">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/transactions">Transactions</a>
        <a class="nav-link" href="/charts">Charts</a>
    </div>
</nav>

<div class="container mt-4">
    <h1>Charts</h1>

    <!-- Success or error messages -->
     <div id="message"></div>

    <!--Month selection-->
    <h2>Month</h2>
    <select id="month-select" class="form-select mb-4"></select>

    <h2>Set Budget</h2>
    <form id="set-budget-form" class="row g-2 mb-4">
        <div class="col-auto">
            <select id="budget-category" class="form-select">
                <option value="">Overall</option>
            </select>
        </div>
        <div class="col-auto">
            <input type="number" step="0.01" min ="0" id="budget-limit" class="form-control" placeholder="Limit in EUR" required>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Save Budget</button>
        </div>
    </form>

    <div class="row">
        <div class="col-12 col-lg-6 mb-5">
            <h2>Spending by Category (EUR)</h2>
            <div class="chart-box">
                <canvas id="category-chart"></canvas>
            </div>
        </div>
        <div class="col-12 col-lg-6 mb-5">
            <h2>Income by category (EUR)</h2>
            <div class="chart-box">
                <canvas id="income-chart"></canvas>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12 col-lg-6 mb-5">
            <h2>Overall Budget (EUR)</h2>
            <div class="chart-box">
                <canvas id="overall-budget-chart"></canvas>
            </div>
        </div>
        <div class="col-12 col-lg-6 mb-5">
            <h2>Budget per Category (EUR)</h2>
            <div class="chart-box">
            <canvas id="category-budget-chart"></canvas>
        </div>
    </div>
    </div>

    <div class="row">
        <div class="col-12 col-lg-6 mb-5">
            <h2>Income vs. Expenses (EUR)</h2>
            <canvas id="monthly-chart"></canvas>
        </div>
        <div class="col-12 col-lg-6 mb-5">
            <h2>Spending Trends (EUR)</h2>
            <canvas id="trends-chart"></canvas>
        </div>
    </div>  

    <div class="row">
        <div class="col-12 col-lg-6 mb-5">
            <h2>Net Worth (EUR)</h2>
            <div class="chart-box">
                <canvas id="networth-chart"></canvas>
            </div>
        </div>
    </div>
</div>

<!--Chart.js for the graphs-->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!--JavaScripts that loads and draws the charts-->
<script src="{{ url_for('static', filename='charts.js')}}"></script>

</body>
</html>
